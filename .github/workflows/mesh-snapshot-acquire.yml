name: Acquire official MeSH 2026 sources

on:
  push:
    branches: [feature/mesh-2026-snapshot-v1]
    paths: ['.github/workflows/mesh-snapshot-acquire.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and fingerprint official production-year files
        run: |
          python - <<'PY'
          import datetime, gzip, hashlib, json, pathlib, time, urllib.request
          import xml.etree.ElementTree as ET
          root = pathlib.Path('mesh-acquisition')
          root.mkdir()
          base = 'https://nlmpubs.nlm.nih.gov/projects/mesh/MESH_FILES/xmlmesh/'
          sources = {
              'desc2026.xml.gz': base + 'desc2026.gz',
              'supp2026.xml.gz': base + 'supp2026.gz',
              'qual2026.xml': base + 'qual2026.xml',
              'nlmdescriptorrecordset_20260101.dtd': 'https://www.nlm.nih.gov/databases/dtd/nlmdescriptorrecordset_20260101.dtd',
              'nlmsupplementalrecordset_20260101.dtd': 'https://www.nlm.nih.gov/databases/dtd/nlmsupplementalrecordset_20260101.dtd',
              'nlmqualifierrecordset_20260101.dtd': 'https://www.nlm.nih.gov/databases/dtd/nlmqualifierrecordset_20260101.dtd',
          }
          evidence = {'requested_mesh_year': 2026, 'sources': []}
          for name, url in sources.items():
              p = root / name
              for attempt in range(4):
                  try:
                      request = urllib.request.Request(url, headers={'User-Agent': 'ClinSearch-Crosswalk-MeSH-Snapshot/1.0', 'Accept-Encoding': 'identity'})
                      digest = hashlib.sha256(); n = 0
                      with urllib.request.urlopen(request, timeout=120) as r, p.open('wb') as f:
                          headers = {k: r.headers.get(k) for k in ['Last-Modified', 'ETag', 'Content-Length', 'Content-Type']}
                          final_url = r.url
                          while block := r.read(1024 * 1024):
                              f.write(block); digest.update(block); n += len(block)
                      evidence['sources'].append({'filename': name, 'url': url, 'final_url': final_url, 'sha256': digest.hexdigest(), 'bytes': n, 'downloaded_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'response_headers': headers})
                      print(name, n, digest.hexdigest(), flush=True)
                      break
                  except Exception:
                      if attempt == 3:
                          raise
                      time.sleep(3 * 2**attempt)
          for name, record_tag, set_tag in [('desc2026.xml.gz', 'DescriptorRecord', 'DescriptorRecordSet'), ('supp2026.xml.gz', 'SupplementalRecord', 'SupplementalRecordSet'), ('qual2026.xml', 'QualifierRecord', 'QualifierRecordSet')]:
              p = root / name
              opener = gzip.open if name.endswith('.gz') else open
              digest = hashlib.sha256()
              with opener(p, 'rb') as f:
                  while block := f.read(1024 * 1024):
                      digest.update(block)
              with opener(p, 'rb') as f:
                  it = ET.iterparse(f, events=('start', 'end'))
                  _, xmlroot = next(it)
                  assert xmlroot.tag == set_tag, xmlroot.tag
                  count = 0; classes = {}; sample = None
                  for event, el in it:
                      if event == 'end' and el.tag == record_tag:
                          count += 1
                          value = el.get('DescriptorClass', el.get('SCRClass', 'qualifier'))
                          classes[value] = classes.get(value, 0) + 1
                          if sample is None:
                              sample = ET.tostring(el, encoding='unicode')
                          el.clear(); xmlroot.clear()
              evidence.setdefault('parsed', {})[name] = {'record_count': count, 'classes': classes, 'xml_sha256': digest.hexdigest()}
              (root / (name + '.sample.txt')).write_text(sample or '', encoding='utf-8')
              print(name, count, classes, flush=True)
          (root / 'acquisition_provenance_v1_YW_18092026.json').write_text(json.dumps(evidence, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(evidence, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mesh-2026-official-xml-v1-YW-18092026
          path: mesh-acquisition/
          compression-level: 0
          retention-days: 30
