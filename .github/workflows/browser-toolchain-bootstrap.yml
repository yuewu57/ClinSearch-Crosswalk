name: Browser toolchain bootstrap
on:
  push:
    branches: [feature/browser-typescript-v1]
    paths: ['browser/package.json', '.github/workflows/browser-toolchain-bootstrap.yml']
permissions:
  contents: write
jobs:
  toolchain:
    if: github.ref == 'refs/heads/feature/browser-typescript-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve and audit locked development dependencies
        working-directory: browser
        run: |
          npm install --ignore-scripts
          npm audit --json > npm-audit.json || true
          node --version > node-version.txt
          npm ls --depth=0 > toolchain-versions.txt
          tar -czf browser-node-modules.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: browser-toolchain
          retention-days: 1
          path: |
            browser/package-lock.json
            browser/browser-node-modules.tar.gz
            browser/npm-audit.json
            browser/node-version.txt
            browser/toolchain-versions.txt
          if-no-files-found: error
      - name: Commit only the initial generated dependency lock
        run: |
          if git ls-files --error-unmatch browser/package-lock.json >/dev/null 2>&1; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- browser/package-lock.json
          git commit -m 'build(browser): lock self-hosted runtime dependencies'
          git push origin HEAD:refs/heads/feature/browser-typescript-v1
