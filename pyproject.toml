[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ovid-pubmed-converter"
version = "0.1.2"
description = "ClinSearch-CrossWalk Ovid MEDLINE to PubMed search strategy convertor"
requires-python = ">=3.12"
license = {file = "LICENSE"}

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
  "reference",
  "src/ovid_pubmed_converter/engine.py",
  "cochrane_data_pubmed_converter_v20_cli_v2_YW_16082026.py",
]
